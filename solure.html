<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solure · Skyggens geometri og himmelens monumenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Manrope:wght@200;300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$','$'], ['\\(','\\)']],
      displayMath: [['$$','$$'], ['\\[','\\]']],
      packages: {'[+]': ['html', 'color']}
    },
    loader: {load: ['[tex]/html', '[tex]/color']}
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  :root{
    --void:#0a0806;
    --deep:#15100a;
    --ink:#ece2cd;
    --muted:#8a7d68;
    --gold:#d4a955;
    --ember:#e8893a;
    --bronze:#b87333;
    --slate:#7a8a98;
    --line:rgba(236,226,205,0.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--void);color:var(--ink);overflow-x:hidden;scroll-behavior:smooth;}
  html{scroll-padding-top:64px;}
  section{scroll-margin-top:64px;}
  body{
    font-family:'Manrope',sans-serif;font-weight:300;line-height:1.65;
    background:
      radial-gradient(ellipse at 80% 10%, rgba(232,137,58,0.10), transparent 55%),
      radial-gradient(ellipse at 15% 60%, rgba(212,169,85,0.05), transparent 50%),
      var(--void);
    min-height:100vh;
  }
  .stars{
    position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.55;
    background-image:
      radial-gradient(1px 1px at 13% 28%, rgba(255,240,200,0.9), transparent),
      radial-gradient(1px 1px at 67% 12%, rgba(255,240,200,0.7), transparent),
      radial-gradient(1px 1px at 81% 78%, white, transparent),
      radial-gradient(1.2px 1.2px at 31% 91%, rgba(255,225,180,0.7), transparent),
      radial-gradient(1.5px 1.5px at 47% 45%,rgba(255,240,200,0.5),transparent),
      radial-gradient(1px 1px at 7% 67%,white,transparent),
      radial-gradient(1px 1px at 92% 35%,white,transparent),
      radial-gradient(1.5px 1.5px at 55% 22%,rgba(212,169,85,0.5),transparent),
      radial-gradient(1px 1px at 23% 58%,white,transparent),
      radial-gradient(1px 1px at 73% 88%,rgba(255,240,200,0.7),transparent);
  }
  main{position:relative;z-index:1;}

  h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;font-weight:400;letter-spacing:-0.005em;}
  .italic{font-style:italic;color:var(--gold);}
  .mono{font-family:'JetBrains Mono',monospace;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);}

  /* TOP NAV */
  .topnav{
    position:fixed;top:0;left:0;right:0;z-index:100;
    background:rgba(10,8,6,0.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:1500px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:1rem;
    padding:0.75rem 1.5rem;
  }
  @media(min-width:980px){.nav-inner{padding:0.8rem 3rem;}}
  .nav-brand{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.25rem;
    color:var(--gold);text-decoration:none;font-weight:400;flex-shrink:0;letter-spacing:0.01em;
  }
  .nav-brand .dot{display:inline-block;width:5px;height:5px;background:var(--ember);border-radius:50%;vertical-align:middle;margin-left:0.4rem;
    box-shadow:0 0 8px rgba(232,137,58,0.6);}
  .nav-links{display:flex;gap:0.1rem;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;}
  .nav-links::-webkit-scrollbar{display:none;}
  .nav-links a{
    font-family:'JetBrains Mono',monospace;font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);
    text-decoration:none;padding:0.45rem 0.75rem;white-space:nowrap;
    transition:color 0.25s ease, border-color 0.25s ease;border-bottom:1px solid transparent;
  }
  .nav-links a:hover{color:var(--ink);}
  .nav-links a.active{color:var(--gold);border-bottom-color:var(--gold);}
  @media(max-width:680px){
    .nav-brand{font-size:1.05rem;}
    .nav-brand .full{display:none;}
    .nav-links a{font-size:0.62rem;padding:0.4rem 0.55rem;letter-spacing:0.08em;}
  }
  @media(max-width:420px){.nav-brand{display:none;}}

  /* HERO */
  .hero{min-height:auto;display:grid;grid-template-columns:1fr;align-items:center;padding:5rem 1.5rem 3rem;position:relative;}
  @media(min-width:980px){
    .hero{grid-template-columns:1fr 1.1fr;padding:6rem 5rem 4rem;gap:3rem;min-height:84vh;}
  }
  .hero-text .label{margin-bottom:1.2rem;}
  .hero-text h1{font-size:clamp(2.6rem,7vw,5.4rem);line-height:0.95;margin-bottom:1.5rem;font-weight:300;}
  .hero-text h1 .ital{font-style:italic;color:var(--gold);font-weight:400;}
  .hero-text h1 .ember{color:var(--ember);font-style:italic;}
  .hero-text p{color:var(--muted);max-width:44ch;font-size:1.05rem;}
  .hero-3d{width:100%;max-width:680px;margin:0 auto;position:relative;}
  .hero-3d canvas{display:block;}
  .hero-meta{
    margin-top:1rem;font-size:0.7rem;letter-spacing:0.18em;color:var(--muted);
    text-transform:uppercase;text-align:center;
  }

  /* SECTION */
  section{padding:3.5rem 1.5rem;position:relative;}
  @media(min-width:980px){section{padding:4.5rem 5rem;}}
  .section-num{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:3.6rem;color:var(--gold);opacity:0.5;line-height:1;margin-bottom:0.4rem;font-weight:300;}
  .section-title{font-size:clamp(1.9rem,4.5vw,3.2rem);line-height:1.05;margin-bottom:1.2rem;max-width:20ch;font-weight:300;}
  .section-body{color:var(--muted);max-width:64ch;font-size:1.05rem;margin-bottom:1.4rem;}
  .section-body strong{color:var(--ink);font-weight:500;}
  .section-body em{color:var(--gold);font-style:italic;}
  .divider{height:1px;background:var(--line);margin:0 1.5rem;}

  /* SUB H3 */
  section h3.sub{
    font-size:1.4rem;margin:1.5rem 0 0.6rem;color:var(--ink);font-weight:400;
    font-family:'Cormorant Garamond',serif;
  }

  /* 3D STAGE */
  .stage{
    border:1px solid var(--line);background:rgba(21,16,10,0.5);
    border-radius:2px;padding:1rem;position:relative;overflow:hidden;
    margin-bottom:1rem;
  }
  .stage canvas{display:block;width:100%;height:auto;border-radius:1px;cursor:grab;}
  .stage canvas:active{cursor:grabbing;}
  .stage-info{
    text-align:center;margin-top:0.8rem;font-size:0.78rem;color:var(--muted);letter-spacing:0.05em;
  }
  .legend{display:flex;gap:1.3rem;flex-wrap:wrap;justify-content:center;margin-top:0.9rem;font-size:0.78rem;color:var(--muted);}
  .legend .item{display:flex;align-items:center;gap:0.45rem;}
  .legend .swatch{width:16px;height:2px;}

  /* TOGGLE BUTTONS */
  .toggle-row{display:flex;gap:0.4rem;flex-wrap:wrap;margin:0.9rem 0;justify-content:center;}
  .toggle{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:0.55rem 1.1rem;font-family:'Manrope',sans-serif;font-weight:400;
    font-size:0.74rem;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;
    transition:all 0.25s ease;
  }
  .toggle:hover{color:var(--ink);border-color:var(--gold);}
  .toggle.active{background:var(--gold);color:var(--void);border-color:var(--gold);}

  /* MATH BLOCK */
  .math-block{
    border-left:2px solid var(--gold);padding:1.2rem 1.6rem;
    background:rgba(21,16,10,0.5);margin:1.2rem 0;
    font-size:1.05rem;overflow-x:auto;
  }
  .math-block .label{font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:0.6rem;}
  .math-block .desc{color:var(--muted);font-size:0.9rem;margin-top:0.7rem;line-height:1.55;}

  /* SCRUB ROW */
  .scrub-row{display:flex;align-items:center;gap:1rem;margin-top:0.8rem;flex-wrap:wrap;justify-content:center;}
  .scrub-row label{font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);}
  .scrub-row input[type=range]{width:240px;accent-color:var(--gold);}
  .scrub-row .val{font-family:'JetBrains Mono',monospace;font-size:0.78rem;color:var(--gold);min-width:3.6rem;text-align:right;}

  /* TYPE CARDS */
  .type-grid{
    display:grid;grid-template-columns:1fr;gap:0.6rem;margin:1rem 0 1.4rem;
  }
  @media(min-width:680px){.type-grid{grid-template-columns:repeat(5,1fr);}}
  .type-card{
    border:1px solid var(--line);background:rgba(21,16,10,0.4);
    padding:0.9rem;cursor:pointer;transition:all 0.25s ease;text-align:center;
  }
  .type-card:hover{border-color:var(--gold);background:rgba(212,169,85,0.06);}
  .type-card.active{border-color:var(--gold);background:rgba(212,169,85,0.1);}
  .type-card .icon{font-size:1.4rem;margin-bottom:0.3rem;color:var(--gold);}
  .type-card .name{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--ink);font-weight:400;}
  .type-card .name em{color:var(--muted);font-style:italic;font-size:0.85rem;display:block;margin-top:0.1rem;}

  .type-detail{
    margin-top:1rem;padding:1.2rem 1.4rem;border:1px solid var(--line);
    background:rgba(21,16,10,0.3);
  }
  .type-detail h4{
    font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--ink);
    font-weight:400;margin-bottom:0.4rem;
  }
  .type-detail .lat-name{
    font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-size:0.95rem;margin-bottom:0.6rem;
  }
  .type-detail p{color:var(--muted);font-size:0.96rem;margin-bottom:0.5rem;}
  .type-detail .key-fact{
    margin-top:0.7rem;padding:0.6rem 0.9rem;
    border-left:2px solid var(--ember);background:rgba(232,137,58,0.06);
    font-size:0.9rem;color:var(--ink);font-style:italic;
    font-family:'Cormorant Garamond',serif;font-size:1.05rem;
  }

  /* GEOMETRY VISUAL */
  .geom-vis{
    border:1px solid var(--line);background:rgba(21,16,10,0.5);
    padding:1rem;margin:1rem 0;
  }
  .geom-vis svg{width:100%;height:auto;display:block;}
  .geom-readout{
    display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:0.8rem;
    text-align:center;font-size:0.85rem;
  }
  .geom-readout .label{font-family:'JetBrains Mono',monospace;font-size:0.65rem;
    letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:0.2rem;}
  .geom-readout .value{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.4rem;color:var(--gold);}

  /* JANTAR MANTAR FEATURE */
  .feature{
    background:linear-gradient(180deg,rgba(212,169,85,0.05),rgba(232,137,58,0.02));
    border:1px solid rgba(212,169,85,0.25);
    padding:1.5rem 1.4rem;margin:1.2rem 0;position:relative;
  }
  @media(min-width:680px){.feature{padding:2rem 2.2rem;}}
  .feature .badge{
    position:absolute;top:-0.6rem;left:1.2rem;
    background:var(--void);padding:0 0.7rem;
    font-family:'JetBrains Mono',monospace;font-size:0.66rem;
    letter-spacing:0.22em;color:var(--ember);
  }
  .feature h3{
    font-family:'Cormorant Garamond',serif;font-size:1.7rem;color:var(--ink);
    font-weight:400;margin-bottom:0.2rem;
  }
  .feature .subtitle{
    font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);
    font-size:1rem;margin-bottom:1rem;
  }
  .feature p{color:var(--muted);font-size:0.96rem;margin-bottom:0.8rem;}

  .specs{
    display:grid;grid-template-columns:1fr 1fr;gap:0.8rem 1.2rem;margin:1rem 0;
    padding:0.9rem 1rem;border:1px solid var(--line);background:rgba(10,8,6,0.4);
  }
  @media(min-width:680px){.specs{grid-template-columns:repeat(4,1fr);}}
  .spec .label{font-family:'JetBrains Mono',monospace;font-size:0.62rem;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:0.15rem;}
  .spec .value{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.3rem;color:var(--gold);line-height:1.1;}
  .spec .unit{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--muted);margin-left:0.2rem;}

  /* FAMOUS LIST */
  .famous{
    display:grid;grid-template-columns:1fr;gap:0.7rem;margin:1.2rem 0;
  }
  @media(min-width:760px){.famous{grid-template-columns:1fr 1fr;}}
  .famous .item{
    border:1px solid var(--line);padding:0.9rem 1.1rem;background:rgba(21,16,10,0.3);
    display:grid;grid-template-columns:auto 1fr auto;gap:0.8rem 1rem;align-items:baseline;
  }
  .famous .item .yr{
    font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--gold);
    letter-spacing:0.08em;
  }
  .famous .item .nm{
    font-family:'Cormorant Garamond',serif;font-size:1.18rem;color:var(--ink);
    font-weight:400;
  }
  .famous .item .nm em{color:var(--muted);font-style:italic;font-size:0.85rem;display:block;margin-top:0.05rem;}
  .famous .item .loc{font-size:0.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:0.06em;text-align:right;}

  /* ANALEMMA */
  .analemma-wrap{
    border:1px solid var(--line);background:rgba(21,16,10,0.5);
    padding:1rem;margin:1rem 0;
  }
  .analemma-wrap svg{width:100%;height:auto;display:block;max-width:480px;margin:0 auto;}

  /* PULL QUOTE */
  .pull-quote{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.4rem,2.8vw,2rem);
    line-height:1.3;color:var(--ink);max-width:32ch;margin:1.6rem auto;
    text-align:center;font-weight:300;
    padding:1.4rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  }
  .pull-quote .attr{display:block;font-size:0.72rem;letter-spacing:0.18em;text-transform:uppercase;font-style:normal;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:1rem;}

  /* FACTS */
  .facts{
    display:grid;grid-template-columns:repeat(2,1fr);gap:1px;
    background:var(--line);border:1px solid var(--line);margin-top:1.5rem;
  }
  @media(min-width:800px){.facts{grid-template-columns:repeat(4,1fr);}}
  .fact{background:var(--void);padding:1.3rem 1.1rem;}
  .fact-num{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:2.4rem;color:var(--gold);line-height:1;margin-bottom:0.25rem;font-weight:400;}
  .fact-label{font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);}

  /* FOOTER */
  footer{padding:2.5rem 1.5rem 2rem;text-align:center;color:var(--muted);font-size:0.85rem;border-top:1px solid var(--line);margin-top:3rem;}
  footer .sig{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-size:1.2rem;margin-top:0.5rem;font-weight:400;}

  /* REVEAL */
  .reveal{opacity:0;transform:translateY(20px);transition:opacity 1s ease,transform 1s ease;}
  .reveal.in{opacity:1;transform:none;}

  /* MATHJAX SPACING */
  mjx-container[display="true"]{margin:0.55em 0 !important;}
  .math-block mjx-container[display="true"]{margin:0.4em 0 !important;}

  /* HISTORY TIMELINE */
  .timeline-svg{
    width:100%;height:auto;display:block;margin:1rem 0 1.5rem;
    border:1px solid var(--line);background:rgba(21,16,10,0.5);padding:0.6rem;
  }
  .milestones{
    display:grid;grid-template-columns:1fr;gap:0.8rem;margin:1.2rem 0;
  }
  @media(min-width:760px){.milestones{grid-template-columns:1fr 1fr;}}
  .milestone{
    border-left:2px solid var(--gold);padding:0.9rem 1.2rem;
    background:rgba(21,16,10,0.4);position:relative;
  }
  .milestone .yr{
    font-family:'JetBrains Mono',monospace;font-size:0.7rem;
    letter-spacing:0.14em;color:var(--ember);margin-bottom:0.25rem;
  }
  .milestone .name{
    font-family:'Cormorant Garamond',serif;font-size:1.25rem;
    color:var(--ink);font-weight:400;margin-bottom:0.1rem;
  }
  .milestone .place{
    font-family:'Cormorant Garamond',serif;font-style:italic;
    color:var(--gold);font-size:0.85rem;margin-bottom:0.5rem;
  }
  .milestone p{color:var(--muted);font-size:0.92rem;margin:0;}
  .milestone.major{
    border-left-color:var(--ember);
    background:linear-gradient(90deg,rgba(232,137,58,0.08),rgba(21,16,10,0.4) 60%);
  }

  /* BUILD-YOUR-OWN */
  .builder{
    border:1px solid rgba(212,169,85,0.25);
    background:linear-gradient(180deg,rgba(212,169,85,0.04),rgba(21,16,10,0.5));
    padding:1.4rem 1.4rem 1.6rem;margin:1.2rem 0;
  }
  @media(min-width:680px){.builder{padding:1.8rem 2rem 2rem;}}
  .builder-controls{
    display:grid;grid-template-columns:1fr;gap:0.8rem;margin-bottom:1.2rem;
  }
  .builder-controls .preset-row{
    display:flex;flex-wrap:wrap;gap:0.4rem;align-items:center;
  }
  .builder-controls .preset-row .lab{
    font-family:'JetBrains Mono',monospace;font-size:0.66rem;letter-spacing:0.14em;
    text-transform:uppercase;color:var(--muted);margin-right:0.4rem;
  }
  .preset-btn{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:0.35rem 0.7rem;font-family:'Manrope',sans-serif;font-size:0.72rem;
    letter-spacing:0.05em;cursor:pointer;transition:all 0.2s ease;
  }
  .preset-btn:hover{color:var(--ink);border-color:var(--gold);}
  .preset-btn.active{background:var(--gold);color:var(--void);border-color:var(--gold);}
  .builder-readout{
    display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem;margin:0.8rem 0;
    padding:0.7rem 0.9rem;background:rgba(10,8,6,0.5);border:1px solid var(--line);
    text-align:center;
  }
  .builder-readout .label{
    font-family:'JetBrains Mono',monospace;font-size:0.6rem;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:0.15rem;
  }
  .builder-readout .value{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.2rem;color:var(--gold);
  }
  .builder-dial{
    background:#f6efde;border:1px solid var(--line);
    padding:1rem;margin:0.8rem 0;
  }
  .builder-dial svg{width:100%;height:auto;display:block;max-width:560px;margin:0 auto;}
  .builder-actions{
    display:flex;gap:0.5rem;flex-wrap:wrap;justify-content:center;margin-top:0.8rem;
  }
  .action-btn{
    background:var(--gold);border:none;color:var(--void);
    padding:0.6rem 1.2rem;font-family:'JetBrains Mono',monospace;font-size:0.72rem;
    letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;transition:all 0.2s ease;
  }
  .action-btn:hover{background:var(--ember);}
  .action-btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold);}
  .action-btn.ghost:hover{background:rgba(212,169,85,0.1);}

  /* PETERSPLADSEN GALLERY */
  .vatican-gallery{
    display:grid;grid-template-columns:repeat(6,1fr);gap:0.5rem;margin:1.4rem 0 1.6rem;
  }
  .vatican-gallery .ph{
    position:relative;overflow:hidden;border:1px solid var(--line);
    background:rgba(21,16,10,0.4);aspect-ratio:1/1;
  }
  .vatican-gallery .ph img{
    width:100%;height:100%;object-fit:cover;display:block;
    filter:saturate(0.85) contrast(1.05);
    transition:transform 0.6s ease, filter 0.4s ease;
  }
  .vatican-gallery .ph:hover img{transform:scale(1.04);filter:saturate(1) contrast(1.08);}
  .vatican-gallery .ph.hero{grid-column:span 4;grid-row:span 2;aspect-ratio:auto;}
  .vatican-gallery .ph.tall{grid-column:span 2;}
  .vatican-gallery .ph .cap{
    position:absolute;bottom:0;left:0;right:0;
    padding:0.45rem 0.6rem 0.4rem;
    background:linear-gradient(180deg,transparent,rgba(10,8,6,0.85));
    font-family:'JetBrains Mono',monospace;font-size:0.6rem;
    letter-spacing:0.1em;text-transform:uppercase;color:var(--ink);
    opacity:0;transition:opacity 0.3s ease;
  }
  .vatican-gallery .ph:hover .cap{opacity:1;}
  @media(max-width:680px){
    .vatican-gallery{grid-template-columns:repeat(2,1fr);gap:0.35rem;}
    .vatican-gallery .ph.hero,
    .vatican-gallery .ph.tall{grid-column:auto;grid-row:auto;aspect-ratio:1/1;}
    .vatican-gallery .ph .cap{opacity:1;font-size:0.55rem;}
  }

  /* MERIDIAN DIAGRAM */
  .meridian-vis{
    border:1px solid var(--line);background:rgba(21,16,10,0.5);
    padding:1rem;margin:1.2rem 0;
  }
  .meridian-vis svg{width:100%;height:auto;display:block;}
  .meridian-readout{
    display:grid;grid-template-columns:repeat(2,1fr);gap:0.6rem;margin:0.8rem 0 0;
    padding:0.7rem 0.9rem;background:rgba(10,8,6,0.5);border:1px solid var(--line);
    text-align:center;
  }
  @media(min-width:680px){.meridian-readout{grid-template-columns:repeat(4,1fr);}}
